<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sound board (dev)</title>
<link rel="icon" href="../assets/icons/icon-192.png">
<!-- Dev-only: audition every synth sound by ear and tune src/audio/sfx.js.
     Open http://127.0.0.1:8124/tools/sound-board.html (python3 tools/serve.py;
     add --lan to try it on the iPad). The server sends no-cache, so edit a
     recipe and reload. Not precached, not part of the game. -->
<style>
  :root { --bg: #fff7e8; --ink: #2b2d42; --card: #ffffff; --line: #eadfca; --accent: #5bc0eb; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--ink);
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { margin: 0 0 12px; color: #6b6b7b; font-size: 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--card);
         border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
  .bar label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .bar input[type=range] { width: 140px; }
  .bar output { min-width: 3.2em; font-variant-numeric: tabular-nums; }
  .state { font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #ffe0e0; }
  .state.running { background: #d9f7df; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .grid button { min-height: 96px; border: 0; border-radius: 20px; font: 600 18px/1.2 inherit; font-family: inherit;
                 color: var(--ink); background: var(--c, #ffd66e); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
                 transition: transform 0.08s; cursor: pointer; }
  .grid button small { display: block; font-weight: 400; font-size: 12px; opacity: 0.7; margin-top: 4px; }
  .grid button:active, .grid button.hit { transform: translateY(3px) scale(0.97); }
  .grid button[data-tuned] { --c: #b5ead7; }
  .row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .row input[type=text] { flex: 1; min-width: 200px; font: inherit; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
  .row button { font: inherit; padding: 12px 18px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; font-weight: 600; }
  #log { margin-top: 12px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #6b6b7b; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Sound board</h1>
<p class="sub">Tap any sound. Green = tuned to the pentatonic scale (tap plink/bell repeatedly for a melody). Recipes live in src/audio/sfx.js; edit, then reload.</p>

<div class="bar">
  <span>Audio: <span id="state" class="state">none</span></span>
  <label>Pitch <input id="pitch" type="range" min="0.5" max="2" step="0.01" value="1"><output id="pitchOut">1.00</output></label>
  <label>Random ± <input id="vary" type="range" min="0" max="0.2" step="0.01" value="0.05"><output id="varyOut">auto</output></label>
  <label>Gain <input id="gain" type="range" min="0" max="1.5" step="0.05" value="1"><output id="gainOut">1.00</output></label>
  <label>Pan <input id="pan" type="range" min="-1" max="1" step="0.1" value="0"><output id="panOut">0.0</output></label>
  <label>Master <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"><output id="volumeOut">0.70</output></label>
  <label><input id="auto" type="checkbox" checked> default variation</label>
  <label><input id="mute" type="checkbox"> mute</label>
</div>

<div class="grid" id="grid"></div>

<div class="row">
  <button id="all">Play all (in order)</button>
  <button id="mash">Mash test (10 at once)</button>
  <button id="melody">Plink x8</button>
</div>

<div class="row">
  <input id="words" type="text" value="Hello! Welcome to our town." aria-label="Words to speak">
  <button id="say">Say it</button>
  <span id="voice"></span>
</div>

<div id="log"></div>

<script type="module">
import { initAudio, sfx, speech, audio, setMuted } from '../src/audio/index.js';
import { RECIPES } from '../src/audio/sfx.js';

initAudio();
const $ = (id) => document.getElementById(id);
const log = (msg) => { $('log').textContent = `${msg}\n${$('log').textContent}`.split('\n').slice(0, 12).join('\n'); };

function opts() {
  const o = { pitch: Number($('pitch').value), gain: Number($('gain').value), pan: Number($('pan').value) };
  if (!$('auto').checked) o.vary = Number($('vary').value);
  return o;
}

function play(name) {
  const h = sfx.play(name, opts());
  const btn = document.querySelector(`[data-sound="${name}"]`);
  if (btn) { btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 90); }
  log(h ? `${name}  ${(h.end - h.start).toFixed(2)}s  voices=${sfx.activeVoices()}` : `${name}  (dropped: ${audio.state()})`);
  return h;
}

for (const name of sfx.names) {
  const b = document.createElement('button');
  b.dataset.sound = name;
  if (RECIPES[name].tuned) b.dataset.tuned = '';
  b.innerHTML = `${name}<small>${RECIPES[name].dur.toFixed(2)}s</small>`;
  // pointerdown for snappy auditioning. It is only a real unlock gesture for a
  // mouse; on a touch screen the pointerup/touchend listener unlocks, and the
  // sound scheduled here starts a moment later when the context resumes.
  b.addEventListener('pointerdown', () => { audio.gesture(); play(name); });
  $('grid').appendChild(b);
}

for (const id of ['pitch', 'vary', 'gain', 'pan', 'volume']) {
  const upd = () => {
    const v = Number($(id).value);
    $(id + 'Out').textContent = id === 'vary' && $('auto').checked ? 'auto' : v.toFixed(id === 'pan' ? 1 : 2);
    if (id === 'volume') audio.setVolume(v);
  };
  $(id).addEventListener('input', upd);
  upd();
}
$('auto').addEventListener('change', () => $('vary').dispatchEvent(new Event('input')));
$('mute').addEventListener('change', () => setMuted($('mute').checked));

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
$('all').addEventListener('click', async () => {
  for (const name of sfx.names) { play(name); await wait(RECIPES[name].dur * 1000 + 250); }
});
$('mash').addEventListener('click', () => {
  ['pop', 'boing', 'plink', 'squish', 'clink', 'bubble', 'tap', 'thud', 'sparkle', 'cheer'].forEach(play);
});
$('melody').addEventListener('click', async () => {
  for (let i = 0; i < 8; i++) { play('plink'); await wait(220); }
});

$('say').addEventListener('click', async () => {
  const v = speech.voice();
  $('voice').textContent = v === 'default' ? 'voice: platform default' : v ? `voice: ${v.name} (${v.lang})` : 'no offline English voice';
  const ok = await speech.say($('words').value, { interrupt: true });
  log(`say -> ${ok ? 'spoken' : 'fallback (chime)'}`);
});

function showState(s) {
  $('state').textContent = s;
  $('state').className = `state ${s}`;
}
audio.onStateChange(showState);
setInterval(() => showState(audio.state()), 500);

window.__board = { sfx, speech, audio };
document.body.dataset.boot = 'ready';   // for tests/e2e/audio.test.mjs
</script>
</body>
</html>
